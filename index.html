<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolt: Rewind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: fliperama de fita VHS, noite neon de 198X
   IDEA: um gabinete de arcade que toca uma fita gasta
   PICTURE: o próprio jogo, em pixel art de baixa resolução ampliada
   COLOUR and TYPE: roxo-noite, magenta e ciano; Press Start 2P + VT323
   LAYOUT: tela 16:9 no gabinete, legenda de controles embaixo, controles de toque no celular */
:root{color-scheme:dark;--bg:#0b0616;--ink:#f3e9ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#3a0f5e 0,#14082a 45%,#07030f 100%);color:var(--ink);font:18px/1.4 'VT323',ui-monospace,monospace;overflow-x:clip;display:flex;flex-direction:column;align-items:center;padding:clamp(6px,2vw,20px)}
.cab{width:min(100%,1180px);background:linear-gradient(#22123c,#120a22);border:2px solid #3e2670;border-radius:20px;padding:clamp(6px,1.4vw,14px);box-shadow:0 0 60px #ff2fa82e,0 0 0 6px #0b0616,inset 0 2px 0 #5b3fa0}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 30px #000}
#scr{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;margin-top:10px;color:#c9b8ff}
kbd{font-family:'Press Start 2P',monospace;font-size:10px;background:#2a1a4a;border:1px solid #6a4fb0;border-bottom-width:3px;border-radius:4px;padding:3px 6px;color:#fff}
.pad{display:none;width:100%;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;user-select:none;-webkit-user-select:none}
.pad .g{display:flex;gap:10px}
.pad button{width:62px;height:62px;border-radius:50%;border:2px solid #6a4fb0;background:#1e1036;color:#fff;font:12px 'Press Start 2P',monospace;touch-action:none}
.pad button.on{background:#ff2fa8;border-color:#ffd0ee}
.pad .b2{background:#0f2a3a;border-color:#29f0ff}
@media (pointer:coarse){.pad{display:flex}.legend{display:none}}
</style>
</head>
<body>
<div class="cab">
  <div class="screen"><canvas id="scr" width="960" height="540" aria-label="Bolt: Rewind — jogo de plataforma"></canvas></div>
  <div class="pad" id="pad">
    <div class="g"><button data-k="l">◄</button><button data-k="d">▼</button><button data-k="r">►</button></div>
    <div class="g"><button data-k="start" class="b2">ST</button><button data-k="rew" class="b2">REW</button><button data-k="punch" class="b2">SOCO</button><button data-k="super" class="b2">SUP</button><button data-k="jump">PULO</button></div>
  </div>
</div>
<div class="legend">
  <span><kbd>◄</kbd> <kbd>►</kbd> correr</span>
  <span><kbd>Z</kbd>/<kbd>Espaço</kbd> pular (giro de ataque)</span>
  <span><kbd>C</kbd> soco de onda de choque</span>
  <span>no ar: <kbd>Z</kbd> pulo duplo · <kbd>▼</kbd> esmagada de casco</span>
  <span><kbd>V</kbd> Super Bolt (após zerar, 50 discos)</span>
  <span><kbd>▼</kbd> + <kbd>Z</kbd> carregar Turbo Dash</span>
  <span><kbd>X</kbd>/<kbd>Shift</kbd> segurar: VHS Rewind</span>
  <span><kbd>Enter</kbd> avançar · <kbd>P</kbd> pausa · <kbd>M</kbd> som</span>
</div>

 vign=D.createRadialGradient(DW/2,DH/2,DH*.35,DW/2,DH/2,DW*.62);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,.55)')}

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function hsl(h,s,l){return`hsl(${h%360},${s}%,${l}%)`}

// pixel primitives
let PSC=1;
function R(c,x,y,w,h,col){const S=PSC;c.fillStyle=col;c.fillRect(Math.round(x*S),Math.round(y*S),Math.round(w*S),Math.round(h*S))}

function Ln(c,x0,y0,x1,y1,t,col){const S=PSC;x0*=S;y0*=S;x1*=S;y1*=S;t=Math.max(1,Math.round(t*S));c.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1),o=Math.floor(t/2);for(let i=0;i<=n;i++)c.fillRect(Math.round(x0+(x1-x0)*i/n)-o,Math.round(y0+(y1-y0)*i/n)-o,t,t)}
function El(c,cx,cy,rx,ry,col){const S=PSC;cx*=S;cy*=S;rx*=S;ry*=S;c.fillStyle=col;const r=ry+.5;for(let y=-Math.floor(ry);y<=Math.floor(ry);y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(r*r))));c.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1)}}
function Pg(c,pts,col){const S=PSC;if(S!==1)pts=pts.map(p=>[p[0]*S,p[1]*S]);c.fillStyle=col;let mn=1e9,mx=-1e9;for(const p of pts){mn=Math.min(mn,p[1]);mx=Math.max(mx,p[1])}
 for(let y=Math.floor(mn);y<=Math.ceil(mx);y++){const yy=y+.5,xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yy&&b[1]>yy)||(b[1]<=yy&&a[1]>yy))xs.push(a[0]+(yy-a[1])/(b[1]-a[1])*(b[0]-a[0]))}xs.sort((p,q)=>p-q);for(let i=0;i+1<xs.length;i+=2){const x0=Math.round(xs[i]),x1=Math.round(xs[i+1]);if(x1>x0)c.fillRect(x0,y,x1-x0,1)}}}
function Ring(c,cx,cy,r,col,t=1){for(let i=0;i<t;i++){c.fillStyle=col;const n=Math.ceil(r*7);for(let k=0;k<n;k++){const a=k/n*Math.PI*2;c.fillRect(Math.round(cx+Math.cos(a)*(r-i)),Math.round(cy+Math.sin(a)*(r-i)),1,1)}}}

// sprite with dark outline
function rimLight(cv,a=.5){const x=cv.getContext('2d'),W_=cv.width,H_=cv.height,d=x.getImageData(0,0,W_,H_),p=d.data,o=new Uint8ClampedArray(p),L=[255,47,168],Rr=[41,240,255];
 for(let y=1;y<H_-1;y++)for(let xx=2;xx<W_-2;xx++){const i=(y*W_+xx)*4;if(!p[i+3])continue;const rt=!p[i+7],lt=!p[i-1],rt2=!p[i+11],lt2=!p[i-5],up=!p[i-W_*4+3];let c=null,k=a;if(rt)c=Rr;else if(lt)c=L;else if(rt2){c=Rr;k=a*.45}else if(lt2){c=L;k=a*.35}
  if(c){for(let j=0;j<3;j++)o[i+j]=p[i+j]*(1-k)+c[j]*k}else if(up){for(let j=0;j<3;j++)o[i+j]=Math.min(255,p[i+j]*1.3+12)}}
 d.data.set(o);x.putImageData(d,0,0)}
function spr(w,h,ox,oy,fn,ol='#0a0412',rim=false,thick=false){const c=mk(w+2,h+2),x=c.getContext('2d');x.translate(ox+1,oy+1);fn(x);if(rim)rimLight(c);if(thick){const t=mk(w+2,h+2),q=t.getContext('2d');for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])q.drawImage(c,dx,dy);q.globalCompositeOperation='source-in';q.fillStyle=ol;q.fillRect(0,0,w+2,h+2);q.globalCompositeOperation='source-over';q.drawImage(c,0,0);x.clearRect(0,0,w+2,h+2);x.setTransform(1,0,0,1,0,0);x.drawImage(t,0,0)}
 const o=mk(w+2,h+2),q=o.getContext('2d');for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])q.drawImage(c,dx,dy);q.globalCompositeOperation='source-in';q.fillStyle=ol;q.fillRect(0,0,w+2,h+2);q.globalCompositeOperation='source-over';q.drawImage(c,0,0);return{c:o,ox:ox+1,oy:oy+1}}
function tint(s,col,a=1){const k='t'+col+a;if(s[k])return s[k];const c=mk(s.c.width,s.c.height),q=c.getContext('2d');q.drawImage(s.c,0,0);q.globalCompositeOperation='source-atop';q.globalAlpha=a;q.fillStyle=col;q.fillRect(0,0,c.width,c.height);return s[k]={c,ox:s.ox,oy:s.oy,k:s.k}}
function dS(s,x,y,flip,rot=0,alpha=1,scale=1,rc=18){const k=s.k||1;g.save();g.globalAlpha=alpha;g.translate(Math.round(x),Math.round(y));if(flip)g.scale(-1,1);if(scale*k!==1)g.scale(scale*k,scale*k);if(rot){g.translate(0,-rc/k);g.rotate(rot);g.translate(0,rc/k)}g.drawImage(s.c,-s.ox,-s.oy);g.restore()}

// ====================================================================
// SPRITES — BOLT (herói original), METAL BOLT, VIALO, inimigos
// ====================================================================
const PV={fur:'#1f8088',furS:'#135560',furL:'#58c8c6',furD:'#08303a',muz:'#a8e2da',muzS:'#6fb4b0',ear:'#ff8a3d',earD:'#b8501a',vis:'#29f0ff',visD:'#0a3a4a',visL:'#d8ffff',sh:'#ff2fd0',shS:'#b0189a',vest:'#2a2a38',vestL:'#4c4c62',vestD:'#14141e',cy:'#29f0ff',mg:'#ff2fa8',leg:'#174652',legL:'#2c6a78',legB:'#0c2a32',shoe:'#3ee8f0',shoeS:'#1a9aa8',sole:'#6a22b0',bolt:'#ff8a3d',gt:'#1e7aff',gtL:'#45c4ff',gtD:'#0c3a8a',nose:'#0a1a20'};
const PSUP={...PV,fur:'#ffd23f',furS:'#e0900c',furL:'#fff5b0',furD:'#9a5200',muz:'#fff1c0',muzS:'#e8c070',ear:'#ff5a8a',earD:'#c02a5a',vis:'#ff2fa8',visL:'#ffd0f0',sh:'#ffffff',shS:'#ffd0ef',leg:'#7a5a10',legL:'#c09a30',legB:'#4a3408'};

function vegaDraw(c,P_,o){
 const dy=o.dy||0,lx=o.lean||0,hy=(o.hb||0)+dy;

 arm(c,P_,[tx-2,-27+hy*.6],o.a2,1);
 leg(c,P_,hip,o.f2,1);
 // camiseta magenta + colete preto
 const ty=-29+hy*.6;
 Pg(c,[[tx-5,ty],[tx+5,ty],[tx+6,-18+dy],[tx-5,-18+dy]],P_.sh);
 R(c,tx+1,ty+1,2,10,P_.shS);
 Pg(c,[[tx-5,ty],[tx,ty],[tx,-18+dy],[tx-5,-18+dy]],P_.vest);
 Pg(c,[[tx+3,ty],[tx+5,ty],[tx+6,-18+dy],[tx+4,-18+dy]],P_.vest);
 R(c,tx-1,ty+1,1,10,P_.vestL);R(c,tx+3,ty+1,1,10,P_.vestL);R(c,tx-4,ty+4,3,1,P_.vestD);R(c,tx-4,ty+7,3,1,P_.vestD);P(c,tx-3,ty+2,P_.cy);
 R(c,tx-5,ty-1,11,2,P_.vestD);R(c,tx-4,ty-2,3,2,P_.vestL);R(c,tx+3,ty-2,3,2,P_.vestL);
 // cinto + walkman dourado

 R(c,tx-8,-22+dy,4,6,'#ffd23f');R(c,tx-7,-21+dy,2,2,'#8a5c00');P(c,tx-8,-22+dy,'#fff3b0');
 leg(c,P_,hip,o.f1,0);
 head(c,P_,[lx+2,-36+hy],o);
 arm(c,P_,[tx+1,-27+hy*.6],o.a1,0);
}
function leg(c,P_,h,f,back){const[kx,ky,ax,ay]=f;const col=back?P_.legB:P_.leg;
 Ln(c,h[0],h[1],kx,ky,3,col);Ln(c,kx,ky,ax,ay,3,col);if(!back){Ln(c,h[0]+1,h[1],kx+1,ky,1,P_.legL)}
 // tênis cano alto com raio
 const b=back?P_.shoeS:P_.shoe;
 R(c,ax-2,ay-3,5,4,b);R(c,ax-2,ay-3,5,1,P_.sole);
 R(c,ax-3,ay+1,8,3,b);R(c,ax+4,ay+2,2,2,b);
 if(!back){R(c,ax-2,ay-2,1,3,'#bff8ff');P(c,ax+1,ay,'#ffffff');P(c,ax+2,ay+1,'#ffffff')}
 P(c,ax-1,ay+3,P_.bolt);P(c,ax,ay+2,P_.bolt);P(c,ax+1,ay+2,P_.bolt);P(c,ax+2,ay+1,P_.bolt);
 R(c,ax-3,ay+4,10,2,P_.sole);R(c,ax-3,ay+4,10,1,back?'#8a4ac0':'#c08aff');
}
function arm(c,P_,s,a,back){const[ex,ey,hx_,hy_]=a;
 Ln(c,s[0],s[1],ex,ey,3,back?P_.shS:P_.sh);Ln(c,ex,ey,hx_,hy_,2,back?P_.furD:P_.fur);
 // manopla cibernética

function head(c,P_,[x,y],o){
 // orelhas listradas

 Pg(c,[[x+1,y-6],[x+5,y-13],[x+7,y-4]],P_.fur);Pg(c,[[x+2,y-7],[x+5,y-11],[x+6,y-5]],P_.ear);R(c,x+3,y-9,3,1,P_.furD);R(c,x+3,y-7,3,1,P_.furD);

 Pg(c,[[x-7,y],[x-11,y+2],[x-6,y+4]],P_.fur);Pg(c,[[x-6,y+3],[x-10,y+6],[x-4,y+5]],P_.furS);
 // topete curto

 // visor

 const v=o.eye==='blink'?P_.visD:P_.vis;R(c,x+1,y-3,9,3,v);

 if(o.eye==='hurt'){Ln(c,x+3,y-3,x+6,y-1,1,P_.visD)}

// ---------- BOLT, O TATU (sprite em alta densidade: 2x mais pixels) ----------
const PW={fur:'#2d7486',furS:'#1c4c5c',furD:'#0c2632',furL:'#58aebb',furH:'#a6e4e6',pale:'#d6eeee',paleS:'#93bfc6',paleD:'#5d8c96',
 ear:'#ff8a3d',earD:'#b4501a',vis:'#29f0ff',visT:'#c8ffff',visB:'#1490c8',visD:'#062a3a',frame:'#141a26',
 sh:'#ff2fd0',shS:'#b8189c',shL:'#ff8ae8',vest:'#23232f',vestL:'#4a4a60',vestD:'#0e0e16',pant:'#184a58',pantS:'#0e3038',pantL:'#2e7484',
 shoe:'#3ee8f0',shoeS:'#1c9eb0',shoeL:'#b8ffff',sole:'#6a22b0',soleL:'#b07aff',bolt:'#ff8a3d',boltL:'#ffd23f',
 gt:'#1e74ff',gtL:'#5cc6ff',gtD:'#0a2e86',gtX:'#04123a',cy:'#29f0ff',mg:'#ff2fa8'};
const PWS={...PW,fur:'#e8b020',furS:'#b07a10',furD:'#5a3a00',furL:'#ffd860',furH:'#fff4b8',pale:'#fff6d8',paleS:'#ecd08a',paleD:'#b08a3a',vis:'#ff2fa8',visT:'#ffd0f0',visB:'#b0186a',sh:'#ffffff',shS:'#ffc8ee',shL:'#ffffff',pant:'#6a4a10',pantS:'#3a2808',pantL:'#a07a20'};
function thick(c,a,b,t,col,hl,sh){Ln(c,a[0],a[1],b[0],b[1],t,col);if(sh)Ln(c,a[0]-1,a[1]+1,b[0]-1,b[1]+1,Math.max(1,t-3),sh);if(hl)Ln(c,a[0]+1,a[1]-1,b[0]+1,b[1]-1,1,hl)}
function wolfLeg(c,P_,h,f,back){const[kx,ky,ax,ay]=f,k=[kx,ky],a=[ax,ay];
 thick(c,h,k,7,back?P_.pantS:P_.pant,back?null:P_.pantL,back?null:P_.pantS);thick(c,k,a,6,back?P_.pantS:P_.pant,back?null:P_.pantL,null);
 if(!back){El(c,kx+1,ky,3,3,'#14141e');El(c,kx+1,ky-1,2,2,'#3a3a50');P(c,kx+2,ky-1,P_.cy);R(c,(h[0]+kx)/2-2,(h[1]+ky)/2,4,4,P_.pantS);R(c,(h[0]+kx)/2-1,(h[1]+ky)/2+1,2,1,P_.pantL)}
 // tênis cano alto
 const S=back?P_.shoeS:P_.shoe,SS=back?'#127080':P_.shoeS;
 R(c,ax-4,ay-6,9,7,S);R(c,ax-4,ay-6,9,2,P_.sole);R(c,ax-4,ay-4,2,5,SS);
 R(c,ax-5,ay+1,14,5,S);R(c,ax+6,ay+2,4,4,S);El(c,ax+8,ay+4,2,1,back?SS:P_.shoeL);R(c,ax-5,ay+4,15,1,SS);

let AC=null,MG=null,NB=null,muted=false,song=null,nextT=0,step=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.32;MG.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,type='square',v=.1,f2=0,lp=0){if(!AC||muted)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);let n=o;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}n.connect(gn);gn.connect(MG);o.start(t);o.stop(t+d+.02)}

function musicTick(){if(!AC||!song||muted)return;const sp=60/song.bpm/4;while(nextT<AC.currentTime+.12){const t=nextT,s=step%16,bar=Math.floor(step/16),c=song.p[bar%4];
